name: 응급의료 뉴스 자동 수집

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 뉴스 수집 실행
        run: python scripts/fetch_news.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "뉴스 자동 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Pages 배포용 파일 준비
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
